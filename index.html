<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Omnia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#fbe3f1">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Nunito:wght@400;600;800&display=swap">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="h" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7fb0"/>
      <stop offset="1" stop-color="#d42f69"/>
    </linearGradient>
  </defs>
</svg>

<div class="backdrop" aria-hidden="true"></div>
<div class="field" id="field" aria-hidden="true"></div>

<main class="card" id="card">
  <div class="big-heart" id="bigHeart" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path fill="url(#hg)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      <path fill="#fff" fill-opacity="0.45" d="M6.4 6.2c.9-.9 2.2-1.1 3.1-.6-1.4.2-2.6 1.1-3 2.6-.3 1-.1 1.6-.5 1.6-.7-1.2-.6-2.8.4-3.6z"/>
    </svg>
  </div>

  <h1 id="heading" aria-live="polite">Hi Omnia! </h1>

  <div class="lead" id="lead">
    <p class="soft">I know that i made a strong mistake</p>
    <p class="ask">But can you give me a second chance or exception?</p>
  </div>

  <div class="actions" id="actions">
    <button class="btn btn-yes" id="yes" type="button">YES! 💖</button>
    <span class="no-slot" id="noSlot"><button class="btn btn-no" id="no" type="button">No 😢</button></span>
  </div>

  <section class="success" id="success" aria-live="polite" hidden>
    <!-- <p class="s-emoji">❤️</p> -->
    <p class="s-title">Thank you, Omnia!</p>
    <p class="s-line">You made me so happy! </p>
    <p class="s-line">Sending you a big smile!</p>
  </section>
</main>
<script src="index.js">
</script>
</body></html>
